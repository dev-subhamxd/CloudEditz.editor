<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudEditz — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --bg-raised:#12151b;
    --field:#0d1015;
    --hairline:#22262e;
    --white:#f4f6f8;
    --muted:#8b93a1;
    --muted-2:#565d68;
    --teal:#2DD4BF;
    --green:#34d399;
    --coral:#fb7185;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:36px 18px 60px;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(45,212,191,0.07), transparent 60%),
      radial-gradient(ellipse 50% 40% at 100% 20%, rgba(167,139,250,0.06), transparent 60%);
    pointer-events:none;
  }
  .panel{position:relative;z-index:1;width:100%;max-width:440px;}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
  .brand-left{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px 2px rgba(45,212,191,0.7);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(0.8);}}
  .status-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);border:1px solid var(--hairline);border-radius:20px;padding:6px 12px;}
  .status-pill .sdot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);}
  .status-pill.on .sdot{background:var(--green);box-shadow:0 0 8px 1px rgba(52,211,153,.7);}
  .status-pill.on{color:var(--green);}

  section.card{background:var(--bg-raised);border:1px solid var(--hairline);border-radius:12px;padding:26px 22px 28px;}
  .card h1{
    font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;
    margin-bottom:6px;
  }
  .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
  .field input{width:100%;background:var(--field);border:1px solid var(--hairline);border-radius:8px;padding:13px 14px;color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:14px;outline:none;transition:border-color .15s ease;}
  .field input:focus{border-color:var(--teal);}

  button.btn{width:100%;padding:14px 0;border-radius:8px;border:1px solid var(--hairline);background:transparent;color:var(--white);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s ease, filter .12s ease;}
  button.btn:active{transform:scale(0.98);}
  button.btn.primary{background:linear-gradient(90deg,#2DD4BF,#34d399);color:#052018;border:none;}
  button.btn.primary:hover{filter:brightness(1.08);}
  button.btn.outline-teal{border-color:var(--teal);color:var(--teal);}
  button.btn[disabled]{opacity:.5;cursor:not-allowed;}

  .msg{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:12.5px;line-height:1.5;display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(251,113,133,0.08);border:1px solid rgba(251,113,133,0.35);color:var(--coral);}
  .msg.ok{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.35);color:var(--green);}

  .session{display:none;}
  .session.show{display:block;}
  .idrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--field);border:1px solid var(--hairline);border-radius:8px;margin-bottom:10px;font-size:13px;}
  .idrow span.k{color:var(--muted);}
  .idrow span.v{color:var(--white);}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

  footer{text-align:center;margin-top:22px;color:var(--muted-2);font-size:11px;}
</style>
</head>
<body>

<div class="panel">
  <div class="brand">
    <div class="brand-left"><span class="dot"></span>CloudEditz</div>
    <div class="status-pill" id="statusPill"><span class="sdot"></span><span id="statusText">connecting…</span></div>
  </div>

  <!-- ===== SIGN IN ===== -->
  <section class="card" id="authCard">
    <h1>Sign in</h1>
    <div class="sub">Accounts are created directly in the database. There's no sign-up here.</div>
    <form id="signinForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="si-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="si-password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit" id="si-btn">Sign in</button>
      <div class="msg" id="si-msg"></div>
    </form>
  </section>

  <!-- ===== SIGNED-IN STATE ===== -->
  <section class="card session" id="sessionCard">
    <div class="idrow"><span class="k">Username</span><span class="v" id="sess-username">—</span></div>
    <div class="idrow"><span class="k">ID</span><span class="v" id="sess-id">—</span></div>
    <div class="idrow"><span class="k">This browser</span><span class="v" id="sess-device">—</span></div>

    <div class="stack">
      <button class="btn primary" id="openEditorBtn">Open the Editor →</button>
      <button class="btn outline-teal" id="freeDeviceBtn">Free this browser (sign in elsewhere)</button>
      <button class="btn" id="signOutBtn">Sign out</button>
    </div>
    <div class="msg" id="sess-msg"></div>
  </section>

  <footer>CloudEditz · Users/ · asia-southeast1</footer>
</div>

<script>
/* =========================================================================
   CONFIG — accounts are created manually in the DB under this path.
   Each record needs at least: { "Username": "...", "ID": "...", "Password": "..." }
   ========================================================================= */
const DB_URL = "https://star-community-orv-dokaebi-default-rtdb.asia-southeast1.firebasedatabase.app";
const USERS_PATH = "CloudEditz/Users";

function getDeviceId(){
  let id = localStorage.getItem("cloudeditz_device_id");
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(16).slice(2)));
    localStorage.setItem("cloudeditz_device_id", id);
  }
  return id;
}

async function fetchAllUsers(){
  const res = await fetch(`${DB_URL}/${USERS_PATH}.json`);
  if(!res.ok) throw new Error("Could not reach the database.");
  const data = await res.json();
  return data || {};
}

async function patchUser(key, partial){
  const res = await fetch(`${DB_URL}/${USERS_PATH}/${key}.json`, {
    method: "PATCH",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(partial)
  });
  if(!res.ok) throw new Error("Could not update the database.");
  return res.json();
}

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = "msg show " + (ok ? "ok" : "err");
}

/* connection status pill */
(async function checkConnection(){
  const pill = document.getElementById("statusPill");
  const text = document.getElementById("statusText");
  try{
    await fetchAllUsers();
    pill.classList.add("on");
    text.textContent = "connected";
  }catch(e){
    text.textContent = "offline";
  }
})();

/* sign in */
document.getElementById("signinForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("si-msg");
  const btn = document.getElementById("si-btn");
  const username = document.getElementById("si-username").value.trim();
  const password = document.getElementById("si-password").value;

  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    const users = await fetchAllUsers();
    const entry = Object.entries(users).find(
      ([,u]) => u && u.Username && u.Username.toLowerCase() === username.toLowerCase()
    );
    if(!entry){
      showMsg(msg, "No account with that username.");
      btn.disabled = false; btn.textContent = "Sign in";
      return;
    }
    const [key, user] = entry;
    if(password !== user.Password){
      showMsg(msg, "Wrong password.");
      btn.disabled = false; btn.textContent = "Sign in";
      return;
    }

    const deviceId = getDeviceId();
    if(user.BoundDevice && user.BoundDevice !== deviceId){
      showMsg(msg, "This account is already signed in on another browser. Use \"Free this browser\" from that session first.");
      btn.disabled = false; btn.textContent = "Sign in";
      return;
    }
    if(!user.BoundDevice){
      await patchUser(key, { BoundDevice: deviceId });
    }

    startSession({ Username: user.Username, ID: user.ID || "—", key });
  }catch(err){
    showMsg(msg, err.message || "Something went wrong.");
  }
  btn.disabled = false; btn.textContent = "Sign in";
});

/* session UI */
function startSession(user){
  localStorage.setItem("cloudeditz_session", JSON.stringify(user));
  document.getElementById("authCard").style.display = "none";
  document.getElementById("sessionCard").classList.add("show");
  document.getElementById("sess-username").textContent = user.Username;
  document.getElementById("sess-id").textContent = user.ID;
  document.getElementById("sess-device").textContent = getDeviceId().slice(0,8) + "…";
}

function endSessionUI(){
  localStorage.removeItem("cloudeditz_session");
  document.getElementById("authCard").style.display = "block";
  document.getElementById("sessionCard").classList.remove("show");
  document.getElementById("signinForm").reset();
}

document.getElementById("signOutBtn").addEventListener("click", endSessionUI);

document.getElementById("freeDeviceBtn").addEventListener("click", async ()=>{
  const msg = document.getElementById("sess-msg");
  const raw = localStorage.getItem("cloudeditz_session");
  if(!raw) return;
  const user = JSON.parse(raw);
  try{
    await patchUser(user.key, { BoundDevice: null });
    showMsg(msg, "This browser has been freed. You can now sign in on another one.", true);
  }catch(err){
    showMsg(msg, err.message || "Couldn't free this browser.");
  }
});

document.getElementById("openEditorBtn").addEventListener("click", ()=>{
  window.location.href = "index.html";
});

/* resume session on load */
(function resume(){
  const raw = localStorage.getItem("cloudeditz_session");
  if(raw){
    try{ startSession(JSON.parse(raw)); }catch(e){}
  }
})();
</script>

</body>
</html>
